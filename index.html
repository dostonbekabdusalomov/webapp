<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop</title>

    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js">
      const res = await fetch("https://your-api.onrender.com/products");
    </script>

    <!-- Style -->
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #fff;
      }

      header {
        padding: 15px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        background: #1e293b;
      }

      .container {
        padding: 15px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 15px;
      }

      .card {
        background: #1e293b;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        transition: 0.2s;
      }

      .card:hover {
        transform: scale(1.03);
      }

      .card img {
        width: 100%;
        height: 140px;
        object-fit: cover;
      }

      .card-body {
        padding: 10px;
      }

      .name {
        font-size: 14px;
        margin-bottom: 5px;
      }

      .price {
        font-size: 13px;
        color: #38bdf8;
        margin-bottom: 10px;
      }

      .btn {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 8px;
        background: #22c55e;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }

      .btn:active {
        background: #16a34a;
      }
    </style>
  </head>

  <body>
    <header>🛒 Shop</header>

    <div class="container" id="products"></div>

    <script>
      const tg = window.Telegram.WebApp
      tg.expand()

      // 🔥 TEST PRODUCTS (keyin backenddan olamiz)
      const products = [
        {
          id: 1,
          name: 'AK-47 Skin',
          price: 10000,
          image: 'https://i.imgur.com/8Km9tLL.jpg'
        },
        {
          id: 2,
          name: 'AWP Dragon',
          price: 25000,
          image: 'https://i.imgur.com/Z8l4Krb.jpg'
        }
      ]

      const container = document.getElementById('products')

      function render() {
        container.innerHTML = ''

        products.forEach(p => {
          const card = document.createElement('div')
          card.className = 'card'

          card.innerHTML = `
        <img src="${p.image}">
        <div class="card-body">
          <div class="name">${p.name}</div>
          <div class="price">${p.price} so'm</div>
          <button class="btn" onclick="buy(${p.id})">Sotib olish</button>
        </div>
      `

          container.appendChild(card)
        })
      }

      function buy(id) {
        const product = products.find(p => p.id === id)

        tg.sendData(
          JSON.stringify({
            action: 'buy',
            id: product.id,
            name: product.name,
            price: product.price
          })
        )
      }

      render()
    </script>
  </body>
</html>
